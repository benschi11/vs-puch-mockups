<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsere Schule – Variante C | VS Puch bei Weiz</title>
<link rel="icon" href="img/favicon.svg"><link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="shared/chrome.css">
<style>
/* ======================================================================
   Variante C – "Das Kind im Mittelpunkt"
   Nur Theme-Tokens (--color-*, --font-*) + eigene Klassen mit Praefix lb-
   ====================================================================== */
:root {
    --g-herz: #bb0600;   /* = primary */
    --g-kopf: #2b5f86;
    --g-hand: #a65300;
    --g-welt: #4d6622;   /* = secondary */
    --lb-shadow: 0 12px 28px #4d66221f;
    --lb-shadow-lg: 0 30px 60px #4d662229;
    --lb-ease: cubic-bezier(.22, .8, .3, 1);
}
.lb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Hero-Motto ---------- */
.lb-motto { margin: 1.4rem auto 0; display: flex; flex-wrap: wrap; justify-content: center; gap: .15rem .9rem;
    font-family: var(--font-display); font-weight: 500; font-size: clamp(1.15rem, 2.4vw, 1.6rem); color: var(--color-secondary-container); }
.lb-motto span + span::before { content: "·"; margin-right: .9rem; opacity: .6; }

/* ---------- Kurzer Einstieg "Unsere Schule" (untergeordnet) ---------- */
.lb-schule { padding: 3rem 0 0; }
.lb-schule-row { display: flex; gap: 1.25rem; align-items: flex-start; max-width: 60rem; padding-bottom: 2.75rem; border-bottom: 1px solid color-mix(in oklch, var(--color-tertiary) 18%, transparent); }
.lb-schule-icon { flex: none; display: grid; place-items: center; width: 3.25rem; height: 3.25rem; border-radius: 1rem; background: var(--color-surface-alt); font-size: 1.6rem; }
.lb-schule .mk-prose h2 { font-size: 1.35rem; }
.lb-schule .mk-prose p { margin-top: .5rem; font-size: .98rem; line-height: 1.7; max-width: 72ch; }
@media (min-width: 900px) { .lb-schule .mk-prose { display: grid; grid-template-columns: 1fr 1fr; column-gap: 3rem; } .lb-schule .mk-prose h2 { grid-column: 1 / -1; } }
@media (max-width: 600px) { .lb-schule-icon { display: none; } }

/* ---------- Intro (Mittelpunkt) ---------- */
.lb-intro { padding: 3.5rem 0 5rem; }
.lb-intro-h { font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--color-primary); }
.lb-intro-grid { display: grid; gap: 2.5rem; align-items: start; }
@media (min-width: 900px) { .lb-intro-grid { grid-template-columns: 7fr 5fr; gap: 5rem; } }
.lb-lead { font-family: var(--font-display); font-weight: 600; font-size: clamp(2rem, 4.4vw, 3.25rem); line-height: 1.08; color: var(--color-primary); letter-spacing: -.01em; }
.lb-lead-rest { margin-top: 1.25rem; font-size: clamp(1.1rem, 1.6vw, 1.3rem); line-height: 1.65; color: var(--color-on-surface); max-width: 38ch; }
.lb-intro-side { padding-top: 1.75rem; border-top: 2px solid color-mix(in oklch, var(--color-secondary) 25%, transparent); }
@media (min-width: 900px) { .lb-intro-side { margin-top: .6rem; } }
.lb-intro-side p { line-height: 1.75; color: var(--color-tertiary); font-size: 1.05rem; }
.lb-intro-side .lb-kid-note { margin-top: 1.5rem; display: flex; gap: .75rem; align-items: center; font-family: var(--font-display); font-weight: 600; color: var(--color-secondary); }
.lb-intro-side .lb-kid-note a { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; text-decoration-color: color-mix(in oklch, var(--color-secondary) 40%, transparent); }
.lb-intro-side .lb-kid-note a:hover { text-decoration-color: currentColor; }

/* ---------- Orbit-Sektion ---------- */
.lb-orbit-section { background: var(--color-surface-alt); padding: 5rem 0 5.5rem; position: relative; }
.lb-head { text-align: center; max-width: 40rem; margin: 0 auto; }
.lb-head h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.1rem, 4vw, 3rem); line-height: 1.1; margin-top: .5rem; }
.lb-head p.lb-hint { margin-top: .9rem; color: var(--color-tertiary); }
.lb-kbd { display: inline-block; min-width: 1.6em; padding: 0 .35em; border-radius: .4rem; background: var(--color-surface-card); border: 1px solid color-mix(in oklch, var(--color-tertiary) 25%, transparent); font-size: .85em; font-weight: 700; text-align: center; }

.lb-stage-grid { display: grid; gap: 2rem; margin-top: 2.5rem; justify-items: center; }
@media (min-width: 1180px) { .lb-stage-grid { grid-template-columns: minmax(0, 1fr) 25rem; gap: 3.5rem; align-items: center; justify-items: stretch; margin-top: 3rem; } }

.lb-orbit-wrap { container-type: inline-size; width: 100%; max-width: 47.5rem; }
.lb-orbit {
    --R: 24.5;        /* Ringradius in cqi */
    --cy: 38;         /* Mittelpunkt y in cqi */
    --node: clamp(52px, 9cqi, 70px);
    position: relative; height: 76cqi;
}
.lb-rings { position: absolute; left: 50cqi; top: calc(var(--cy) * 1cqi);
    width: calc(var(--R) * 2.5cqi); height: calc(var(--R) * 2.5cqi); translate: -50% -50%; overflow: visible; }
.lb-rings .spoke { stroke: color-mix(in oklch, var(--color-tertiary) 30%, transparent); stroke-width: 1.5; stroke-dasharray: 2 5; stroke-linecap: round; transition: stroke .25s, stroke-width .25s; }
.lb-rings .spoke.is-active { stroke: var(--g); stroke-width: 3; stroke-dasharray: none; }
.lb-rings .arc { fill: none; stroke-width: 10; stroke-linecap: round; opacity: .22; }

.lb-center { position: absolute; left: 50cqi; top: calc(var(--cy) * 1cqi); translate: -50% -50%;
    width: calc((var(--R) - 8.5) * 2cqi); aspect-ratio: 1; border-radius: 50%;
    background: var(--color-surface-card); box-shadow: 0 0 0 1.4cqi color-mix(in oklch, var(--color-secondary-container) 55%, transparent), var(--lb-shadow);
    display: grid; place-content: center; text-align: center; z-index: 1; }
.lb-center-emoji { font-size: 9cqi; line-height: 1; }
.lb-center-title { font-family: var(--font-display); font-weight: 600; font-size: clamp(1rem, 2.9cqi, 1.45rem); line-height: 1.1; margin-top: .35rem; color: var(--color-on-surface); }
.lb-center-sub { font-size: clamp(.72rem, 1.6cqi, .85rem); font-weight: 700; color: var(--color-secondary); letter-spacing: .02em; margin-top: .15rem; }

.lb-node {
    position: absolute; z-index: 2;
    left: calc(50cqi + var(--c) * var(--R) * 1cqi);
    top: calc(var(--cy) * 1cqi + var(--s) * var(--R) * 1cqi);
    width: var(--node); height: var(--node); translate: -50% -50%;
    border-radius: 50%; border: 2px solid color-mix(in oklch, var(--g) 30%, white);
    background: color-mix(in oklch, var(--g) 9%, white);
    display: grid; place-items: center; cursor: pointer; padding: 0;
    transition: transform .25s var(--lb-ease), background-color .25s, box-shadow .25s, border-color .25s;
}
.lb-node-icon { font-size: calc(var(--node) * .44); line-height: 1; transition: transform .25s var(--lb-ease); }
.lb-node:hover { transform: scale(1.07); border-color: var(--g); }
.lb-node.is-active { background: var(--g); border-color: var(--g); transform: scale(1.14);
    box-shadow: 0 0 0 4px var(--color-surface-alt), 0 0 0 6px color-mix(in oklch, var(--g) 45%, transparent), 0 10px 22px color-mix(in oklch, var(--g) 30%, transparent); }
.lb-node:focus-visible { outline: 3px solid var(--color-on-surface); outline-offset: 7px; }
.lb-node-label {
    position: absolute; width: max-content; max-width: min(8.6rem, 18.5cqi);
    left: calc(50% + var(--c) * (50% + 10px)); top: calc(50% + var(--s) * (50% + 8px));
    translate: var(--tx, -50%) var(--ty, -50%);
    font-family: var(--font-display); font-weight: 500; font-size: clamp(.8rem, 1.95cqi, .95rem); line-height: 1.2;
    color: var(--color-on-surface); text-align: var(--ta, center); pointer-events: none;
    transition: color .2s;
}
.lb-node.is-active .lb-node-label { color: var(--g); font-weight: 600; }
.lb-node.is-active .lb-node-label, .lb-node:hover .lb-node-label { transform: scale(calc(1 / 1.1)); }

.lb-legend { list-style: none; margin: 1.25rem auto 0; padding: 0; display: grid; grid-template-columns: repeat(2, auto); justify-content: center; gap: .5rem 2rem; font-size: .84rem; color: var(--color-tertiary); }
.lb-legend li { display: inline-flex; align-items: center; gap: .45rem; }
.lb-legend b { font-family: var(--font-display); font-weight: 600; color: var(--g); font-size: .98rem; }
.lb-legend i { width: .7rem; height: .7rem; border-radius: 50%; background: var(--g); display: inline-block; }

/* ---------- Infobereich ---------- */
.lb-panel { width: 100%; max-width: 47.5rem; background: var(--color-surface-card); border-radius: 2rem; box-shadow: var(--lb-shadow-lg); padding: 2rem 2rem 1.5rem; display: flex; flex-direction: column; }
@media (min-width: 1180px) { .lb-panel { min-height: 31rem; padding: 2.25rem 2.25rem 1.5rem; } }
.lb-panel-body { flex: 1; }
.lb-panel-body.is-entering { animation: lb-in .35s var(--lb-ease); }
@keyframes lb-in { from { opacity: 0; transform: translateY(8px); } }
.lb-group { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .8rem; border-radius: 999px; font-size: .8rem; font-weight: 700;
    color: var(--g); background: color-mix(in oklch, var(--g) 10%, white); }
.lb-panel-icon { display: grid; place-items: center; width: 4.5rem; height: 4.5rem; margin-top: 1.4rem; border-radius: 1.4rem; font-size: 2.4rem; background: color-mix(in oklch, var(--g) 10%, white); }
.lb-panel h3 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.6rem, 2.6vw, 2rem); line-height: 1.12; margin-top: 1rem; color: var(--color-on-surface); }
.lb-panel-text { margin-top: .9rem; line-height: 1.75; color: var(--color-tertiary); font-size: 1.04rem; }
.lb-panel-nav { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-top: 1.75rem; padding-top: 1.1rem; border-top: 1px solid var(--color-surface-alt); }
.lb-step { display: inline-flex; align-items: center; gap: .35rem; padding: .6rem .95rem; border-radius: 1rem; font-family: var(--font-display); font-weight: 600; font-size: .95rem; color: var(--color-secondary-dark); background: var(--color-surface-alt); cursor: pointer; transition: background-color .15s; min-height: 44px; }
.lb-step:hover { background: var(--color-secondary-container); }
.lb-count { font-size: .85rem; font-weight: 700; color: var(--color-tertiary); font-variant-numeric: tabular-nums; }

/* ---------- Ziel ---------- */
.lb-ziel { background: var(--color-secondary-container); color: var(--color-secondary-dark); position: relative; padding: 2rem 0 5.5rem; }
.lb-wave { display: block; width: 100%; height: 56px; background: var(--color-surface-alt); }
.lb-wave path { fill: var(--color-secondary-container); }
.lb-ziel-grid { display: grid; gap: 2rem; }
@media (min-width: 900px) { .lb-ziel-grid { grid-template-columns: 5fr 7fr; gap: 4.5rem; align-items: end; } }
.lb-ziel .eyebrow { color: var(--color-primary-dark); }
.lb-ziel h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.1rem, 4vw, 3rem); line-height: 1.1; margin-top: .5rem; color: var(--color-on-surface); }
.lb-ziel-text p { line-height: 1.75; font-size: 1.08rem; }
.lb-ziel-text p + p { margin-top: 1rem; }

.lb-saetze { list-style: none; padding: 0; margin: 4rem 0 0; display: grid; gap: 2.5rem; }
@media (min-width: 700px) { .lb-saetze { grid-template-columns: repeat(3, 1fr); gap: 2rem; } }
.lb-satz { position: relative; }
.lb-sprout { display: flex; align-items: flex-end; height: 5.5rem; padding-bottom: .5rem; border-bottom: 3px solid color-mix(in oklch, var(--color-secondary) 45%, transparent); }
.lb-sprout span { line-height: 1; display: inline-block; transform-origin: 50% 100%; }
.lb-satz:nth-child(1) .lb-sprout span { font-size: 2.2rem; }
.lb-satz:nth-child(2) .lb-sprout span { font-size: 3.4rem; }
.lb-satz:nth-child(3) .lb-sprout span { font-size: 4.8rem; }
.lb-satz p { margin-top: 1rem; font-family: var(--font-display); line-height: 1; }
.lb-satz .who { display: block; font-weight: 500; font-size: 1.35rem; color: var(--color-secondary-dark); }
.lb-satz .what { display: block; font-weight: 600; font-size: clamp(2.5rem, 4.6vw, 3.6rem); line-height: 1.02; color: var(--color-primary); margin-top: .35rem; letter-spacing: -.01em; }
.lb-schluss { margin: 4.5rem auto 0; max-width: 34ch; text-align: center; font-family: var(--font-display); font-weight: 500; font-size: clamp(1.4rem, 2.6vw, 1.9rem); line-height: 1.35; color: var(--color-on-surface); }
.lb-schluss::before { content: "🌱"; display: block; font-size: 2rem; margin-bottom: .75rem; }

/* ---------- Mobile: kompakter Ring nur mit Icons, Info darunter ---------- */
@media (max-width: 768px) {
    .lb-intro { padding: 3rem 0 3.5rem; }
    .lb-orbit-section { padding: 3.5rem 0 4rem; }
    .lb-stage-grid { margin-top: 1.5rem; gap: 1.5rem; }
    .lb-orbit { --R: 37; --cy: 50; --node: clamp(44px, 12.6cqi, 64px); height: 100cqi; }
    .lb-center { width: calc((var(--R) - 11) * 2cqi); }
    .lb-center-emoji { font-size: 13cqi; }
    .lb-center-title { font-size: 5cqi; }
    .lb-center-sub { font-size: 3.3cqi; }
    .lb-node-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; translate: none; }
    .lb-node.is-active { box-shadow: 0 0 0 3px var(--color-surface-alt), 0 0 0 5px color-mix(in oklch, var(--g) 45%, transparent); }
    .lb-node:focus-visible { outline-offset: 5px; }
    .lb-panel { padding: 1.5rem 1.35rem 1.1rem; border-radius: 1.5rem; }
    .lb-panel-icon { width: 3.6rem; height: 3.6rem; font-size: 2rem; border-radius: 1.1rem; margin-top: 1.1rem; }
    .lb-step-txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .lb-step { padding: .6rem .9rem; font-size: 1.1rem; min-width: 44px; justify-content: center; }
    .lb-ziel { padding-bottom: 4rem; }
    .lb-saetze { margin-top: 2.5rem; }
    .lb-sprout { height: auto; min-height: 3rem; }
    .lb-satz:nth-child(3) .lb-sprout span { font-size: 4rem; }
}

@media (max-width: 640px) {
    .lb-motto { flex-direction: column; gap: 0; }
    .lb-motto span + span::before { content: none; }
    .lb-hint-keys { display: none; }
    .lb-legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; font-size: .8rem; }
    .lb-legend .lb-legend-desc { display: none; }
}
@media (prefers-reduced-motion: reduce) {
    .lb-node, .lb-node-icon, .lb-rings .spoke { transition: none; }
    .lb-node:hover, .lb-node.is-active { transform: none; }
    .lb-node.is-active .lb-node-label, .lb-node:hover .lb-node-label { transform: none; }
    .lb-panel-body.is-entering { animation: none; }
}
</style></head>
<body class="bg-surface text-on-surface font-body antialiased overflow-x-hidden" data-nav="flat" data-active="schule" data-variant="C">
<main class="pt-20" id="page-content"></main>
<script>window.MOCKUP={schule:'c-schule.html',leitbild:'c-schule.html'};</script>
<script src="shared/leitbild-data.js"></script><script src="shared/chrome.js"></script>
<script>
(function () {
    const L = window.LEITBILD;
    const main = document.getElementById('page-content');
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    /* Ring-Reihenfolge: nach Gruppen gebuendelt, damit die farbigen Boegen zusammenhaengen */
    const GRUPPEN = ['herz', 'kopf', 'hand', 'welt'];
    const items = GRUPPEN.flatMap(g => L.schwerpunkte.filter(s => s.gruppe === g));
    const N = items.length;
    const STEP = 360 / N;
    const START = -90 + STEP / 2;               /* kein Punkt genau oben/unten -> Labels stossen nicht an */
    const rad = d => d * Math.PI / 180;
    const angleOf = i => START + i * STEP;
    const r4 = n => Math.round(n * 10000) / 10000;

    /* ---------- Hero ---------- */
    const motto = `<p class="lb-motto">${L.motto.map(m => `<span>${esc(m)}</span>`).join('')}</p>`;
    const hero = window.pageHero({
        icon: '🏫', eyebrow: 'Unsere Schule', title: L.mittelpunkt.titel,
        crumbs: [['Schule']], waveFill: 'fill-surface', extra: motto
    });

    /* ---------- Intro: die beiden Mittelpunkt-Absaetze ---------- */
    const [p1, p2] = L.mittelpunkt.absaetze;
    const cut = p1.indexOf('. ') + 1;
    const schule = `
<section class="lb-schule" aria-label="Unsere Schule">
    <div class="container-page">
        <div class="lb-schule-row">
            <span class="lb-schule-icon" aria-hidden="true">🏫</span>
            ${window.schulprofilIntro}
        </div>
    </div>
</section>`;
    const intro = `
<section class="lb-intro" aria-labelledby="lb-intro-title">
    <div class="container-page">
        <div class="lb-intro-grid">
            <div>
                <h2 id="lb-intro-title" class="lb-intro-h"><span aria-hidden="true">🌱</span> ${esc(L.titel)}</h2>
                <p class="lb-lead" style="margin-top:1rem">${esc(p1.slice(0, cut))}</p>
                <p class="lb-lead-rest">${esc(p1.slice(cut).trim())}</p>
            </div>
            <div class="lb-intro-side">
                <p>${esc(p2)}</p>
                <p class="lb-kid-note"><span aria-hidden="true" style="font-size:1.6rem">🧒</span><a href="#schwerpunkte">Unsere 12 Schwerpunkte rund um jedes Kind</a></p>
            </div>
        </div>
    </div>
</section>`;

    /* ---------- Orbit ---------- */
    const svgRings = (() => {
        const pt = (deg, r = 1) => `${r4(Math.cos(rad(deg)) * r)} ${r4(Math.sin(rad(deg)) * r)}`;
        let arcs = '', i = 0;
        GRUPPEN.forEach(g => {
            const n = items.filter(s => s.gruppe === g).length;
            const a1 = angleOf(i) - STEP / 2 + 4, a2 = angleOf(i + n - 1) + STEP / 2 - 4;
            arcs += `<path class="arc" d="M ${pt(a1)} A 1 1 0 0 1 ${pt(a2)}" style="stroke:var(--g-${g})" vector-effect="non-scaling-stroke"/>`;
            i += n;
        });
        const spokes = items.map((s, k) => `<line class="spoke" data-spoke="${s.id}" x1="0" y1="0" x2="${r4(Math.cos(rad(angleOf(k))))}" y2="${r4(Math.sin(rad(angleOf(k))))}" style="--g:var(--g-${s.gruppe})" vector-effect="non-scaling-stroke"/>`).join('');
        return `<svg class="lb-rings" viewBox="-1.25 -1.25 2.5 2.5" aria-hidden="true" focusable="false">${spokes}${arcs}</svg>`;
    })();

    const nodes = items.map((s, k) => {
        const a = angleOf(k), c = r4(Math.cos(rad(a))), sn = r4(Math.sin(rad(a)));
        const ta = c > .2 ? 'left' : c < -.2 ? 'right' : 'center';
        const tx = c > .2 ? '0%' : c < -.2 ? '-100%' : '-50%';
        const ty = sn > .35 ? '0%' : sn < -.35 ? '-100%' : '-50%';
        return `<button type="button" class="lb-node" data-id="${s.id}" data-i="${k}" tabindex="-1"
            aria-pressed="false" aria-controls="lb-panel"
            style="--c:${c};--s:${sn};--g:var(--g-${s.gruppe});--ta:${ta};--tx:${tx};--ty:${ty}">
            <span class="lb-node-icon" aria-hidden="true">${s.icon}</span>
            <span class="lb-node-label">${esc(s.titel)}</span>
        </button>`;
    }).join('');

    const legend = `<ul class="lb-legend" aria-label="Farben der vier Bereiche">${GRUPPEN.map(g => {
        const G = L.gruppen[g];
        return `<li style="--g:var(--g-${g})"><i aria-hidden="true"></i><b>${esc(G.label)}</b> <span class="lb-legend-desc">${esc(G.beschreibung)}</span></li>`;
    }).join('')}</ul>`;

    const orbit = `
<section class="lb-orbit-section fun-pattern" id="schwerpunkte" aria-labelledby="lb-orbit-title">
    <div class="container-page">
        <div class="lb-head">
            <p class="eyebrow">Unsere 12 Schwerpunkte</p>
            <h2 id="lb-orbit-title">Rund um jedes Kind</h2>
            <p class="lb-hint">Wähle ein Symbol, um mehr zu erfahren<span class="lb-hint-keys"> – oder blättere mit den <span class="lb-kbd" aria-hidden="true">←</span> <span class="lb-kbd" aria-hidden="true">→</span><span class="lb-sr">Pfeiltasten</span> durch den Kreis</span>.</p>
        </div>
        <div class="lb-stage-grid">
            <div class="lb-orbit-wrap">
                <div class="lb-orbit" role="group" aria-label="Die 12 Schwerpunkte rund um das Kind">
                    ${svgRings}
                    <div class="lb-center" aria-hidden="true">
                        <span class="lb-center-emoji">🧒</span>
                        <span class="lb-center-title">Jedes Kind</span>
                        <span class="lb-center-sub">im Mittelpunkt</span>
                    </div>
                    ${nodes}
                </div>
                ${legend}
            </div>
            <div class="lb-panel" id="lb-panel">
                <div class="lb-panel-body" data-panel-body aria-live="polite" aria-atomic="true"></div>
                <div class="lb-panel-nav">
                    <button type="button" class="lb-step" data-step="-1"><span aria-hidden="true">‹</span><span class="lb-step-txt">Vorheriger</span><span class="lb-sr"> Schwerpunkt</span></button>
                    <span class="lb-count" data-count></span>
                    <button type="button" class="lb-step" data-step="1"><span class="lb-step-txt">Nächster</span><span class="lb-sr"> Schwerpunkt</span><span aria-hidden="true">›</span></button>
                </div>
            </div>
        </div>
    </div>
</section>`;

    /* ---------- Ziel ---------- */
    const Z = L.ziel;
    const sprouts = ['🌱', '🌿', '🌳'];
    const saetze = Z.leitsaetze.map((t, i) => {
        const m = t.match(/^(Jedes Kind)\s+(.*)$/);
        const inner = m ? `<span class="who">${esc(m[1])}</span> <span class="what">${esc(m[2])}</span>` : esc(t);
        return `<li class="lb-satz"><div class="lb-sprout" aria-hidden="true"><span>${sprouts[i] || '🌱'}</span></div><p>${inner}</p></li>`;
    }).join('');
    const ziel = `
<svg class="lb-wave" viewBox="0 0 1440 56" preserveAspectRatio="none" aria-hidden="true"><path d="M0,30 C260,60 560,0 860,22 C1100,40 1280,38 1440,18 L1440,56 L0,56 Z"/></svg>
<section class="lb-ziel" aria-labelledby="lb-ziel-title">
    <div class="container-page">
        <div class="lb-ziel-grid">
            <div>
                <p class="eyebrow">Wohin wir wollen</p>
                <h2 id="lb-ziel-title">${esc(Z.titel)}</h2>
            </div>
            <div class="lb-ziel-text">${Z.absaetze.map(p => `<p>${esc(p)}</p>`).join('')}</div>
        </div>
        <ul class="lb-saetze">${saetze}</ul>
        <p class="lb-schluss">${esc(Z.schluss)}</p>
    </div>
</section>`;

    main.innerHTML = hero + schule + intro + orbit + ziel;

    /* ---------- Interaktion ---------- */
    const btns = [...main.querySelectorAll('.lb-node')];
    const spokes = [...main.querySelectorAll('[data-spoke]')];
    const body = main.querySelector('[data-panel-body]');
    const count = main.querySelector('[data-count]');
    const section = document.getElementById('schwerpunkte');
    let current = -1, hoverT;

    function render(i, { announce = true, fromHover = false } = {}) {
        if (!fromHover) clearTimeout(hoverT);   /* Klick/Tastatur gewinnen gegen eine ausstehende Hover-Vorschau */
        if (i === current) return;
        current = i;
        const s = items[i], G = L.gruppen[s.gruppe];
        btns.forEach((b, k) => {
            const on = k === i;
            b.classList.toggle('is-active', on);
            b.setAttribute('aria-pressed', String(on));
            b.tabIndex = on ? 0 : -1;
        });
        spokes.forEach(l => l.classList.toggle('is-active', l.dataset.spoke === s.id));
        body.setAttribute('aria-live', announce ? 'polite' : 'off');
        body.style.setProperty('--g', `var(--g-${s.gruppe})`);
        main.querySelector('#lb-panel').style.setProperty('--g', `var(--g-${s.gruppe})`);
        body.innerHTML = `
            <p class="lb-group"><span aria-hidden="true">${G.icon}</span> ${esc(G.label)} · ${esc(G.beschreibung)}</p>
            <div class="lb-panel-icon" aria-hidden="true">${s.icon}</div>
            <h3>${esc(s.titel)}</h3>
            <p class="lb-panel-text">${esc(s.text)}</p>`;
        count.textContent = `${i + 1} / ${N}`;
        body.classList.remove('is-entering'); void body.offsetWidth; body.classList.add('is-entering');
    }
    const indexOfId = id => items.findIndex(s => s.id === id);
    const setHash = i => history.replaceState(null, '', '#' + items[i].id);
    const scrollToStage = smooth => section.scrollIntoView({ block: 'start', behavior: smooth && !reduceMotion.matches ? 'smooth' : 'auto' });

    btns.forEach((b, k) => {
        b.addEventListener('click', () => { render(k); setHash(k); });
        /* Hover-Vorschau nur bei echter Mausbewegung (nicht wenn die Seite unter dem Zeiger scrollt) */
        b.addEventListener('pointermove', e => {
            if (e.pointerType !== 'mouse' || k === current) return;
            clearTimeout(hoverT); hoverT = setTimeout(() => render(k, { announce: false, fromHover: true }), 70);
        });
        b.addEventListener('mouseleave', () => clearTimeout(hoverT));
        b.addEventListener('focus', () => render(k));
        b.addEventListener('keydown', e => {
            const map = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
            let to = null;
            if (e.key in map) to = (k + map[e.key] + N) % N;
            else if (e.key === 'Home') to = 0;
            else if (e.key === 'End') to = N - 1;
            if (to === null) return;
            e.preventDefault();
            render(to); setHash(to); btns[to].focus();
        });
    });
    main.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
        const to = (current + Number(b.dataset.step) + N) % N;
        render(to); setHash(to);
    }));

    /* Deep-Links (#musik ...): beim Laden, bei hashchange und bei Klick auf gleiche Ziele im Mega-Menue */
    function fromHash(smooth) {
        const i = indexOfId(decodeURIComponent(location.hash.slice(1)));
        if (i < 0) return false;
        render(i);
        scrollToStage(smooth);
        return true;
    }
    window.addEventListener('hashchange', () => fromHash(true));
    document.addEventListener('click', e => {
        const a = e.target.closest('a[href*="#"]');
        if (!a || a.pathname !== location.pathname) return;
        const i = indexOfId(a.hash.slice(1));
        if (i < 0) return;
        e.preventDefault();
        history.replaceState(null, '', a.hash);
        render(i);
        const dd = a.closest('[data-mk-dd]');
        if (dd) { dd.classList.remove('is-open'); dd.querySelector('button')?.setAttribute('aria-expanded', 'false'); }
        scrollToStage(true);
        btns[i].focus({ preventScroll: true });
    });

    if (!fromHash(false)) render(0, { announce: false });
    /* Nach dem Laden der Schriften erneut hinscrollen, falls sich die Hoehe verschoben hat */
    if (location.hash && indexOfId(location.hash.slice(1)) >= 0) document.fonts?.ready.then(() => scrollToStage(false));
})();
</script></body></html>
