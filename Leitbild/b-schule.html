html { scroll-padding-top: calc(5rem + var(--subnav-h) + 1.25rem); }

<script>
(function () {
    'use strict';
    const L = window.LEITBILD;
    const G = L.gruppen;
    const SP = L.schwerpunkte;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    /* ---------- Markup ---------- */

        icon: '🏫',

    const sections = [
        ['ueber-uns', '🏫', 'Über uns'],

        ['schwerpunkte', '✨', '12 Schwerpunkte'],
        ['ziel', '🌱', 'Unser Ziel']
    ];
    const subnav = `
<nav class="b-subnav" aria-label="Auf dieser Seite" data-subnav>
    <div class="container-page b-subnav-inner">
        <span class="b-subnav-label">Auf dieser Seite:</span>

            ${sections.map(s => `<li><a href="#${s[0]}" data-sec="${s[0]}"><span aria-hidden="true">${s[1]}</span>${s[2]}</a></li>`).join('')}
        </ul>
    </div>
</nav>`;

    const about = `
<section id="ueber-uns" class="section" aria-labelledby="ueber-uns-h">
    <div class="container-page b-about">
        <div>
            <span class="b-eyebrow"><span aria-hidden="true">🏫</span> Über uns</span>
            ${window.schulprofilIntro.replace('<h2>', '<h2 id="ueber-uns-h">')}
            <a href="#mittelpunkt" class="b-about-link">Was uns dabei leitet <span class="arr" aria-hidden="true">↓</span></a>
        </div>
        <div class="b-facts" role="list" aria-label="Kurz und bündig">
            <div class="b-fact" role="listitem"><div class="b-fact-val">4</div><div class="b-fact-key">Schulstufen</div><div class="b-fact-sub">Eine kleine Schule – bei uns kennt man sich.</div></div>
            <div class="b-fact" role="listitem"><div class="b-fact-val">12</div><div class="b-fact-key">Schwerpunkte</div><div class="b-fact-sub">Von Musik bis Nachhaltigkeit.</div></div>

            <div class="b-fact" role="listitem"><div class="b-fact-val">07:40</div><div class="b-fact-key">Schulbeginn</div><div class="b-fact-sub">Puch 104, mitten im Ort.</div></div>
            <p class="b-facts-note">${L.motto.map(esc).join(' ')}</p>
        </div>
    </div>
</section>`;

    // erstes Satzglied des ersten Absatzes typografisch hervorheben
    const p1 = esc(L.mittelpunkt.absaetze[0]).replace(/^([^.]+\.)/, '<b>$1</b>');
    const orbitNodes = [['herz', '50%', '6%'], ['kopf', '94%', '50%'], ['hand', '50%', '94%'], ['welt', '6%', '50%']];
    const center = `
<div id="leitbild">
<section id="mittelpunkt" class="section section-alt b-mid" aria-labelledby="mittelpunkt-h">
    <div class="container-page b-center">
        <div>
            <span class="b-eyebrow"><span aria-hidden="true">🌱</span> ${esc(L.titel)}</span>
            <h2 id="mittelpunkt-h" class="b-h2">${esc(L.mittelpunkt.titel)}</h2>
            <p class="b-center-quote">${p1}</p>
            <p class="b-center-body">${esc(L.mittelpunkt.absaetze[1])}</p>
        </div>
        <figure>
            <div class="b-orbit">
                <span class="b-orbit-ring" style="--i:0;--a:22%" aria-hidden="true"></span>
                <span class="b-orbit-ring" style="--i:16%;--a:32%" aria-hidden="true"></span>
                <div class="b-orbit-core" aria-hidden="true"><div><span>🧒</span><small>Das Kind</small></div></div>
                ${orbitNodes.map(([g, x, y]) => `
                <a href="#schwerpunkte" class="b-orbit-node" style="--x:${x};--y:${y}" data-goto-filter="${g}">
                    <span class="ic" aria-hidden="true">${G[g].icon}</span><span class="lb">${G[g].label}</span><span class="ds">${G[g].beschreibung}</span>
                </a>`).join('')}
            </div>
            <figcaption class="b-orbit-caption">Unsere 12 Schwerpunkte stärken Herz, Kopf und Hand – und den Blick auf die Welt.</figcaption>
        </figure>
    </div>
</section>`;

    const groupKeys = Object.keys(G);
    const count = g => SP.filter(s => s.gruppe === g).length;
    const filterBtns = [`<button type="button" aria-pressed="true" data-filter="alle">Alle <span class="n">${SP.length}</span></button>`]
        .concat(groupKeys.map(g => `<button type="button" aria-pressed="false" data-filter="${g}"><span aria-hidden="true">${G[g].icon}</span> ${G[g].label} <span class="n"><span class="b-sr">, </span>${count(g)}</span></button>`)).join('');

    const tiles = SP.map(s => `
<li id="${s.id}" data-g="${s.gruppe}" data-tile-li>
    <button type="button" class="b-tile" data-g="${s.gruppe}" data-sp="${s.id}" aria-expanded="false" aria-controls="sp-detail">
        <span class="b-tile-nr" aria-hidden="true">${String(s.nr).padStart(2, '0')}</span>
        <span class="b-tile-ic" aria-hidden="true">${s.icon}</span>
        <span class="b-tile-t">${esc(s.titel)}</span>
        <span class="b-tile-k">${esc(s.kurz)}</span>
    </button>
</li>`).join('');

    const schwerpunkte = `
<section id="schwerpunkte" class="section" aria-labelledby="schwerpunkte-h">
    <div class="container-page">
        <div class="b-sp-head">
            <div>
                <span class="b-eyebrow"><span aria-hidden="true">✨</span> Was uns ausmacht</span>
                <h2 id="schwerpunkte-h" class="b-h2">Unsere 12 Schwerpunkte</h2>
                <p class="b-lead">Tippen Sie auf einen Schwerpunkt, um mehr zu erfahren – oder filtern Sie nach Herz, Kopf, Hand und Welt.</p>
            </div>
        </div>
        <div class="b-filter" role="group" aria-label="Schwerpunkte nach Bereich filtern">${filterBtns}</div>
        <p class="b-filter-desc" aria-live="polite" data-filter-desc></p>
        <div class="b-sp">
            <ul class="b-grid" data-grid>${tiles}</ul>
            <div class="b-detail-slot" data-slot></div>
        </div>
    </div>
</section>`;

    const z = L.ziel;
    const leitsatz = t => { const i = t.lastIndexOf(' '); return `${esc(t.slice(0, i))} <span class="verb">${esc(t.slice(i + 1))}</span>`; };
    const ziel = `
<section id="ziel" class="b-goal" aria-labelledby="ziel-h">
    <svg class="b-goal-wave" viewBox="0 0 1440 64" preserveAspectRatio="none" aria-hidden="true"><path d="M0,40 C260,4 560,64 860,30 C1100,4 1290,18 1440,34 L1440,64 L0,64 Z"/></svg>
    <div class="container-page" style="padding-block: 3.5rem 5rem;">
        <div class="b-goal-grid">
            <div>
                <span class="b-eyebrow"><span aria-hidden="true">🌱</span> Wohin wir wollen</span>
                <h2 id="ziel-h" class="b-h2">${esc(z.titel)}</h2>
            </div>
            <div class="b-goal-text">${z.absaetze.map(p => `<p>${esc(p)}</p>`).join('')}</div>
        </div>
        <ul class="b-leitsaetze">${z.leitsaetze.map(t => `<li>${leitsatz(t)}</li>`).join('')}</ul>
        <p class="b-goal-close">${esc(z.schluss)}</p>
        <div class="b-goal-foot">
            <p class="b-goal-motto">${L.motto.map(esc).join(' · ')}</p>
            <a href="#" class="b-pdf" data-mk-dummy>
                <span class="ic" aria-hidden="true">📄</span>
                <span><span class="t">Leitbild als PDF</span><span class="m">Zum Ausdrucken und Weitergeben · PDF</span></span>
            </a>
        </div>
    </div>
</section>
</div>`;

    const main = document.getElementById('page-content');
    main.innerHTML = hero + subnav + about + center + schwerpunkte + ziel;

    /* ---------- Sticky-Navigation: aktiven Abschnitt markieren ---------- */
    const subnavEl = main.querySelector('[data-subnav]');
    const list = main.querySelector('[data-subnav-list]');
    const links = [...list.querySelectorAll('a')];
    const setActive = id => {
        links.forEach(a => {
            const on = a.dataset.sec === id;
            if (on) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current');
            if (on && list.scrollWidth > list.clientWidth) {
                const left = a.parentElement.offsetLeft - 8;
                list.scrollTo({ left, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
            }
        });
    };
    const visible = new Map();
    const io = new IntersectionObserver(entries => {
        entries.forEach(e => visible.set(e.target.id, e.isIntersecting));
        const current = sections.map(s => s[0]).filter(id => visible.get(id));
        setActive(current.length ? current[current.length - 1] : null);
    }, { rootMargin: '-40% 0px -55% 0px' });
    sections.forEach(s => io.observe(document.getElementById(s[0])));
    // Schatten, sobald die Leiste klebt
    const sentinel = document.createElement('div');
    subnavEl.before(sentinel);
    new IntersectionObserver(([e]) => subnavEl.classList.toggle('is-stuck', !e.isIntersecting), { rootMargin: '-81px 0px 0px 0px' }).observe(sentinel);

    /* ---------- Schwerpunkte: Filter + Detail ---------- */
    const grid = main.querySelector('[data-grid]');
    const slot = main.querySelector('[data-slot]');
    const btns = [...grid.querySelectorAll('[data-sp]')];
    const filterEls = [...main.querySelectorAll('[data-filter]')];
    const descEl = main.querySelector('[data-filter-desc]');
    const byId = Object.fromEntries(SP.map(s => [s.id, s]));
    let activeId = null;
    let filter = 'alle';

    const panel = document.createElement('div');
    panel.className = 'b-detail';
    panel.id = 'sp-detail';
    panel.setAttribute('role', 'region');
    panel.setAttribute('aria-labelledby', 'sp-detail-h');
    const inlineLi = document.createElement('li');
    inlineLi.className = 'b-inline';

    const visibleIds = () => btns.filter(b => !b.closest('li').classList.contains('is-hidden')).map(b => b.dataset.sp);

    function renderPanel(s) {
        const g = G[s.gruppe];
        panel.dataset.g = s.gruppe;
        panel.innerHTML = `
<div class="b-detail-top">
    <span class="b-detail-ic" aria-hidden="true">${s.icon}</span>
    <span class="b-detail-meta"><span class="big">${String(s.nr).padStart(2, '0')}</span><span aria-hidden="true">${g.icon}</span> ${g.label}<span class="desc"> · ${g.beschreibung}</span></span>
</div>
<h3 id="sp-detail-h"><span class="b-sr">Schwerpunkt ${s.nr}: </span>${esc(s.titel)}</h3>
<p class="b-detail-k">${esc(s.kurz)}</p>
<p class="txt">${esc(s.text)}</p>
<div class="b-detail-nav">
    <button type="button" data-step="-1"><span aria-hidden="true">←</span> Vorheriger</button>
    <button type="button" data-step="1">Nächster <span aria-hidden="true">→</span></button>
</div>`;
        if (!reduceMotion.matches) { panel.classList.remove('is-swapping'); void panel.offsetWidth; panel.classList.add('is-swapping'); }
    }

    function place() {
        if (!activeId) { panel.remove(); inlineLi.remove(); return; }
        if (wide.matches) {
            inlineLi.remove();
            if (panel.parentElement !== slot) slot.appendChild(panel);
        } else {
            // nach der letzten sichtbaren Kachel derselben Rasterzeile einfuegen
            const li = document.getElementById(activeId);
            const top = li.offsetTop;
            let last = li;
            let n = li.nextElementSibling;
            while (n) {
                if (n !== inlineLi && !n.classList.contains('is-hidden')) { if (n.offsetTop !== top) break; last = n; }
                n = n.nextElementSibling;
            }
            if (panel.parentElement !== inlineLi) inlineLi.appendChild(panel);
            if (last.nextElementSibling !== inlineLi) last.after(inlineLi);
        }
    }

    function select(id, opts = {}) {
        activeId = id;
        btns.forEach(b => b.setAttribute('aria-expanded', String(b.dataset.sp === id)));
        if (id) renderPanel(byId[id]);
        place();
        if (opts.hash !== false) {
            const url = id ? `#${id}` : location.pathname + location.search;
            history.replaceState(null, '', url);
        }
    }

    function applyFilter(f) {
        filter = f;
        filterEls.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === f)));
        inlineLi.remove();
        grid.querySelectorAll('[data-tile-li]').forEach(li => li.classList.toggle('is-hidden', f !== 'alle' && li.dataset.g !== f));
        descEl.innerHTML = f === 'alle'
            ? `Alle ${SP.length} Schwerpunkte unseres Leitbilds.`
            : `<b>${G[f].icon} ${G[f].label}</b> – ${G[f].beschreibung}: ${count(f)} Schwerpunkte.`;
        const ids = visibleIds();
        if (activeId && !ids.includes(activeId)) select(wide.matches ? ids[0] : null);
        else place();
    }

    grid.addEventListener('click', e => {
        const b = e.target.closest('[data-sp]');
        if (!b) return;
        const id = b.dataset.sp;
        if (id === activeId && !wide.matches) { select(null); return; }
        select(id);
    });
    panel.addEventListener('click', e => {
        const b = e.target.closest('[data-step]');
        if (!b) return;
        const ids = visibleIds();
        const i = ids.indexOf(activeId);
        const next = ids[(i + Number(b.dataset.step) + ids.length) % ids.length];
        select(next);
        grid.querySelector(`[data-sp="${next}"]`).focus({ preventScroll: true });
    });
    filterEls.forEach(b => b.addEventListener('click', () => applyFilter(b.dataset.filter)));
    main.querySelectorAll('[data-goto-filter]').forEach(a => a.addEventListener('click', () => applyFilter(a.dataset.gotoFilter)));

    // Pfeiltasten im Raster
    grid.addEventListener('keydown', e => {
        if (!['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) return;
        const vis = btns.filter(b => !b.closest('li').classList.contains('is-hidden'));
        const i = vis.indexOf(document.activeElement);
        if (i < 0) return;
        const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;
        const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols, Home: -i, End: vis.length - 1 - i }[e.key];
        const t = vis[i + step];
        if (t) { e.preventDefault(); t.focus(); }
    });

    wide.addEventListener('change', () => {
        if (!activeId && wide.matches) select(visibleIds()[0], { hash: false });
        else place();
    });
    let rt;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(place, 120); });

    /* ---------- Deep-Link per Hash ---------- */
    function fromHash(scroll) {
        const id = decodeURIComponent(location.hash.slice(1));
        if (!byId[id]) return false;
        if (filter !== 'alle' && byId[id].gruppe !== filter) applyFilter('alle');
        select(id, { hash: false });
        if (scroll) document.getElementById(id).scrollIntoView({ block: wide.matches ? 'center' : 'start', behavior: 'instant' });
        return true;
    }
    window.addEventListener('hashchange', () => fromHash(true));

    applyFilter('alle');
    if (!fromHash(false) && wide.matches) select(SP[0].id, { hash: false });
    // nach dem Laden der Webfonts erneut zum Anker springen (Layout verschiebt sich sonst)
    if (location.hash) {
        const jump = () => {
            const id = decodeURIComponent(location.hash.slice(1));
            const t = document.getElementById(id);
            if (t) t.scrollIntoView({ block: byId[id] && wide.matches ? 'center' : 'start', behavior: 'instant' });
        };
        (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(jump));
    }
})();
</script></body></html>
